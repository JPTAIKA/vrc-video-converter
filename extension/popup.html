<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRChat 動画リンク変換</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="logo-area">
        <span class="logo-badge">VRC</span>
        <h1>動画リンク変換</h1>
      </div>
      <button id="btnOptions" class="icon-button" title="サーバー設定 (任意)" aria-label="設定">
        ⚙️
      </button>
    </header>

    <!-- YouTube動画検出エリア -->
    <section id="videoInfoSection" class="card video-card">
      <div id="notYoutubeAlert" class="alert-box warning hidden">
        YouTubeの動画ページ（watch または shorts）を開いて実行してください。
      </div>

      <div id="youtubeActiveBox">
        <p class="section-label">現在の動画</p>
        <div class="video-meta">
          <div class="title-wrap">
            <span id="videoTitle" class="video-title">読み込み中...</span>
          </div>
          <span id="videoUrl" class="video-url"></span>
        </div>
      </div>
    </section>

    <!-- アクションボタンエリア -->
    <section id="actionSection" class="action-grid">
      <!-- 1. VRChat標準リンク (一番おすすめ / 全員再生可能 / サーバー不要) -->
      <button id="btnCleanConvert" class="btn btn-primary">
        <div class="btn-icon">🌐</div>
        <div class="btn-text">
          <span class="btn-title">VRChat用リンク (全員視聴用)</span>
          <span class="btn-desc">余計なパラメータを除去・即時コピー</span>
        </div>
      </button>

      <!-- 2. 直結ストリーム抽出 (403・Bot拒否回避用 / 拡張機能単体で完結) -->
      <button id="btnStreamExtract" class="btn btn-secondary">
        <div class="btn-icon">⚡</div>
        <div class="btn-text">
          <span class="btn-title">直結ストリーム (MP4) 抽出</span>
          <span class="btn-desc">YouTubeのBot拒否を回避 (サーバー不要)</span>
        </div>
      </button>

      <!-- 3. 高画質モード (Renderサーバー経由 / 1080p) -->
      <button id="btnHqConvert" class="btn btn-secondary">
        <div class="btn-icon">🚀</div>
        <div class="btn-text">
          <span class="btn-title">高画質変換 (1080p・サーバー)</span>
          <span class="btn-desc">映像+音声結合 (クラウドサーバー経由)</span>
        </div>
      </button>
    </section>

    <!-- 処理中ステータス -->
    <div id="loadingBox" class="card status-card hidden">
      <div class="spinner"></div>
      <p id="loadingText" class="status-text">処理中... 少々お待ちください</p>
      <span id="loadingSubtext" class="status-subtext"></span>
    </div>

    <!-- 結果表示エリア -->
    <div id="resultBox" class="card result-card hidden">
      <div class="result-header">
        <span class="badge success-badge">✓ コピー完了</span>
        <span id="resultQuality" class="quality-label"></span>
      </div>
      <p class="copy-notice">VRChat内の動画プレイヤーにペーストできます！</p>
      
      <div class="url-copy-box">
        <input type="text" id="resultUrlInput" readonly>
        <button id="btnManualCopy" class="btn-copy-small" title="再コピー">コピー</button>
      </div>

      <div id="resultMeta" class="result-meta-note"></div>
    </div>

    <!-- エラー表示エリア -->
    <div id="errorBox" class="card error-card hidden">
      <div class="error-header">⚠️ お知らせ</div>
      <p id="errorMessage" class="error-text"></p>
    </div>

    <!-- フッター -->
    <footer class="footer">
      <span id="serverStatusText">拡張機能単体で動作中 (サーバー不要)</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
