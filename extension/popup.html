<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRChat 1080p 動画リンク変換</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="logo-area">
        <span class="logo-badge">VRC 1080p</span>
        <h1>動画リンク変換</h1>
      </div>
      <button id="btnOptions" class="icon-button" title="サーバー設定" aria-label="設定">
        ⚙️
      </button>
    </header>

    <!-- YouTube動画検出エリア -->
    <section id="videoInfoSection" class="card video-card">
      <div id="notYoutubeAlert" class="alert-box warning hidden">
        YouTubeの動画ページ（watch または shorts）を開いて実行してください。
      </div>

      <div id="youtubeActiveBox">
        <p class="section-label">現在の動画</p>
        <div class="video-meta">
          <div class="title-wrap">
            <span id="videoTitle" class="video-title">読み込み中...</span>
          </div>
          <span id="videoUrl" class="video-url"></span>
        </div>
      </div>
    </section>

    <!-- 画質選択エリア -->
    <section id="resolutionSection" class="card resolution-card">
      <div class="card-header-row">
        <span class="section-label">画質を選択</span>
        <span id="resBadge" class="res-badge">1080p 最高画質</span>
      </div>
      <div class="quality-pills">
        <button type="button" class="pill-btn active" data-res="1080">
          <span class="pill-title">1080p</span>
          <span class="pill-sub">FHD</span>
        </button>
        <button type="button" class="pill-btn" data-res="720">
          <span class="pill-title">720p</span>
          <span class="pill-sub">HD</span>
        </button>
        <button type="button" class="pill-btn" data-res="480">
          <span class="pill-title">480p</span>
          <span class="pill-sub">SD</span>
        </button>
        <button type="button" class="pill-btn" data-res="360">
          <span class="pill-title">360p</span>
          <span class="pill-sub">軽量</span>
        </button>
      </div>
    </section>

    <!-- アクションボタンエリア -->
    <section id="actionSection" class="action-grid">
      <!-- 1. 高画質モード (選択した解像度) -->
      <button id="btnHqConvert" class="btn btn-primary">
        <div class="btn-icon">🚀</div>
        <div class="btn-text">
          <span class="btn-title"><span id="btnResLabel">1080p</span> 変換してコピー</span>
          <span class="btn-desc">映像+音声多重化・VRChat高速ストリーム</span>
        </div>
      </button>

      <!-- 2. VRChat標準リンク (通常モード) -->
      <button id="btnCleanConvert" class="btn btn-secondary">
        <div class="btn-icon">🌐</div>
        <div class="btn-text">
          <span class="btn-title">通常リンク (全員同期)</span>
          <span class="btn-desc">Publicインスタンス向け・標準画質</span>
        </div>
      </button>
    </section>

    <!-- 処理中ステータス -->
    <div id="loadingBox" class="card status-card hidden">
      <div class="spinner"></div>
      <p id="loadingText" class="status-text">1080p高画質ストリームを生成中...</p>
      <span id="loadingSubtext" class="status-subtext">※ 映像と音声を高速結合しています (約3〜5秒)</span>
    </div>

    <!-- 結果表示エリア -->
    <div id="resultBox" class="card result-card hidden">
      <div class="result-header">
        <span class="badge success-badge">✓ コピー完了</span>
        <span id="resultQuality" class="quality-label"></span>
      </div>
      <p class="copy-notice">VRChat内の動画プレイヤーにペーストしてください！</p>
      
      <div class="url-copy-box">
        <input type="text" id="resultUrlInput" readonly>
        <button id="btnManualCopy" class="btn-copy-small" title="再コピー">コピー</button>
      </div>

      <div id="resultMeta" class="result-meta-note"></div>
    </div>

    <!-- エラー表示エリア -->
    <div id="errorBox" class="card error-card hidden">
      <div class="error-header">⚠️ お知らせ</div>
      <p id="errorMessage" class="error-text"></p>
    </div>

    <!-- フッター -->
    <footer class="footer">
      <span id="serverStatusText">サーバー確認中...</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
