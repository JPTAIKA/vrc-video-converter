services:
  - type: web
    name: vrc-video-converter-api
    env: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: CACHE_TTL_SECONDS
        value: 3600
      - key: MAX_CACHE_SIZE_MB
        value: 1500
      - key: MAX_VIDEO_DURATION_SECONDS
        value: 1800
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
